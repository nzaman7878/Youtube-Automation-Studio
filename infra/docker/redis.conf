# Redis configuration for YT Automation Studio (BullMQ Optimized)
# Ensure noeviction policy so queued jobs and locks are never discarded under memory pressure
maxmemory 512mb
maxmemory-policy noeviction

# AOF persistence for queue durability across container restarts
appendonly yes
appendfsync everysec

# Network & Connection tuning
tcp-backlog 511
timeout 0
tcp-keepalive 300
